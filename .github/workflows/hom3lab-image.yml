name: Hom3lab image

on:
  workflow_run:
    workflows: ['SeerrNG CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hom3lab-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'phutur1st/seerrng' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to your GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive fork version from validated source
        id: version
        shell: bash
        run: |
          printf 'value=%s-hom3lab\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          printf 'epoch=%s\n' "$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build and publish validated image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/phutur1st/seerrng:hom3lab
            ghcr.io/phutur1st/seerrng:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            COMMIT_TAG=${{ github.event.workflow_run.head_sha }}
            BUILD_VERSION=${{ steps.version.outputs.value }}
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/phutur1st/seerrng
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=hom3lab-amd64
          cache-to: type=gha,mode=max,scope=hom3lab-amd64
          provenance: mode=max
